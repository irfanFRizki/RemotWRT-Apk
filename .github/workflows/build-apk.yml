name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the GitHub Release on push main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_FINGERPRINT: 'F9:75:BD:56:36:57:7E:9B:C5:9D:EC:05:EF:26:14:FC:D8:28:2B:AA:A3:9F:D2:CB:A4:DE:95:77:05:47:40:B2'
      IS_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      # Scope signing secrets to non-PR triggers or same-repository PRs only.
      # Fork PRs cannot access secrets and must build unsigned without fingerprint checks.
      HAS_SIGNING: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_KEYSTORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Set artifact suffix
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "ARTIFACT_SUFFIX=-pr-${{ github.event.number }}" >> "$GITHUB_ENV" ;;
            workflow_dispatch) echo "ARTIFACT_SUFFIX=-dispatch-${{ github.run_number }}" >> "$GITHUB_ENV" ;;
            *) echo "ARTIFACT_SUFFIX=" >> "$GITHUB_ENV" ;;
          esac

      - name: Build debug APK
        run: gradle assembleDebug -PverCode=${{ github.run_number }} --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RemotWRTBot-debug-apk${{ env.ARTIFACT_SUFFIX }}
          path: app/build/outputs/apk/debug/app-debug.apk

      # Decodes the RELEASE_KEYSTORE_BASE64 secret into a keystore file and
      # exposes path + passwords via GITHUB_ENV for app/build.gradle.kts.
      # Skipped on fork PRs (and on push main if signing secrets are absent).
      - name: Decode release keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "${{ runner.temp }}/release.keystore"
          test -s "${{ runner.temp }}/release.keystore"
          {
            printf 'RELEASE_KEYSTORE_PATH=%s\n' "${{ runner.temp }}/release.keystore"
            printf 'RELEASE_KEYSTORE_PASSWORD=%s\n' "$KS_PASS"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KS_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASS"
          } >> "$GITHUB_ENV"

      # Build release APK:
      # - push main: signed when HAS_SIGNING is true, else unsigned
      # - same-repo pull_request: signed
      # - fork pull_request: unsigned
      # - workflow_dispatch: signed
      - name: Build release APK
        run: gradle assembleRelease -PverCode=${{ github.run_number }} --no-daemon

      # Verify release APK fingerprint against v47 release key.
      # Required on same-repo PRs, workflow_dispatch, and signed push main builds.
      # Skipped on fork PRs (unsigned) and unsigned push main builds.
      - name: Verify release APK fingerprint
        if: ${{ env.IS_SAME_REPO_PR == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && env.HAS_SIGNING == 'true') }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Signed release APK not found at $APK"
            ls -la app/build/outputs/apk/release/ 2>/dev/null || true
            exit 1
          fi

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT_DIR="$SDK/build-tools"
          find_apksigner() {
            local p m=""
            for p in "$1"/*/apksigner; do
              [ -x "$p" ] && m+="${p}"$'\n'
            done
            if [ -n "$m" ]; then
              printf '%s' "$m" | sort -V | tail -n1
            fi
          }
          APKSIGNER="$(find_apksigner "$BT_DIR")"
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $BT_DIR (SDK=$SDK, ANDROID_HOME=${ANDROID_HOME:-<unset>}, ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>})"
            ls -la "$BT_DIR" 2>/dev/null || ls -la "$SDK" 2>/dev/null || echo "$SDK does not exist"
            MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"; [ -x "$MGR" ] || MGR="$(command -v sdkmanager || true)"
            [ -x "$MGR" ] && { (set +o pipefail; yes | "$MGR" --sdk_root="$SDK" "build-tools;34.0.0"); APKSIGNER="$(find_apksigner "$BT_DIR")"; }
          fi
          [ -n "$APKSIGNER" ] || { echo "::error::no apksigner found; checked $BT_DIR"; exit 1; }

          echo "Using apksigner: $APKSIGNER"

          if CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK" 2>&1); then
            RAW_FP=$(printf '%s\n' "$CERT_INFO" | grep -i 'SHA-256 digest:' | head -n1 | sed -E 's/.*digest:[[:space:]]*//' || true)
          else
            CODE=$?
            echo "::error::apksigner verify failed (exit $CODE)"
            printf '%s\n' "$CERT_INFO"
            exit "$CODE"
          fi

          if [ -z "$RAW_FP" ]; then
            echo "::error::Could not extract SHA-256 fingerprint from APK using apksigner"
            printf '%s\n' "$CERT_INFO"
            exit 1
          fi

          normalize_fp() { printf '%s' "$1" | tr 'a-z' 'A-Z' | tr -cd '0-9A-F' | sed -E 's/(..)/\1:/g; s/:$//'; }
          FP=$(normalize_fp "$RAW_FP")
          EXP=$(normalize_fp "$EXPECTED_FINGERPRINT")
          [ "${#FP}" -eq 95 ] || { echo "::error::Unexpected fingerprint format: $FP"; exit 1; }

          echo "APK SHA-256 fingerprint: $FP"
          if [ "$FP" = "$EXP" ]; then
            echo "Fingerprint MATCH (matches v47 release key)"
          else
            echo "::error::Fingerprint MISMATCH (expected $EXP, got $FP)"
            exit 1
          fi

      # Upload release APK artifact — distinct name per trigger
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemotWRTBot-release-apk${{ env.ARTIFACT_SUFFIX }}
          path: app/build/outputs/apk/release/app-release*.apk

      # Publish GitHub Release — ONLY on push to main when signing is configured.
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: RemotWRT Bot v${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
